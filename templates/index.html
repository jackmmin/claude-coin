<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업비트 코인 차트</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

<header>
  <h1>업비트 코인 차트</h1>
  <span class="upbit-badge">UPBIT</span>
</header>

<div class="container">

  <!-- 마켓 선택 (공통) -->
  <div class="controls" style="margin-bottom:8px;">
    <select id="marketSelect">
      <option value="">마켓 불러오는 중...</option>
    </select>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="chart">차트</button>
    <button class="tab-btn" data-tab="backtesting">백테스팅</button>
    <button class="tab-btn" data-tab="live-trading">실시간 매매</button>
  </div>

  {% include "partials/chart_tab.html" %}

  {% include "partials/backtesting_tab.html" %}

  {% include "partials/trading_tab.html" %}

</div>

<footer>데이터 출처: Upbit REST API &nbsp;|&nbsp; 차트: Chart.js</footer>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
<script src="{{ url_for('static', filename='js/signals.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_desc.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_params.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_rsi_chart.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_equity_chart.js') }}"></script>
<script src="{{ url_for('static', filename='js/backtesting_render.js') }}"></script>
<script src="{{ url_for('static', filename='js/trading.js') }}"></script>
<script src="{{ url_for('static', filename='js/trading_render.js') }}"></script>
<script src="{{ url_for('static', filename='js/trading_api.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
